[project]
name = "ha-channels-dvr"
version = "0.1.0"
description = "Home Assistant custom integration for the Channels DVR server"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest",
  "pytest-homeassistant-custom-component",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "RUF", # ruff-specific
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
# Match Home Assistant core's import grouping.
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
